<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Settings — Anime Max Zone</title>
    
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="settings.css" />
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <a href="index.html" class="logo-link" aria-label="Anime Max Zone Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" class="nav-logo-svg">
                <defs>
                    <linearGradient id="maxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#e2a0ff" />
                        <stop offset="50%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#7e22ce" />
                    </linearGradient>
                </defs>
                <g font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="180" letter-spacing="2" dominant-baseline="central">
                    <text x="50" y="150" fill="#ffffff">ANIME</text>
                    <text x="740" y="150" fill="url(#maxGradient)" class="animated-max-text">MAX</text>
                </g>
            </svg>
        </a>
        <!-- Top Home Icon Removed -->
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="settings-container">
        
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-avatar">G</div>
            <div class="profile-info">
                <h2>Guest User</h2>
                <p>Free Member</p>
            </div>
            <div class="profile-badge">PRO</div>
        </div>

        <!-- General Settings -->
        <div class="settings-group">
            <div class="settings-group-title">General</div>
            
            <!-- Dark Mode Toggle -->
            <div class="settings-item" id="themeToggleItem">
                <div class="settings-item-left">
                    <div class="icon-wrapper">
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </div>
                    <span>Dark Mode</span>
                </div>
                <div class="toggle-switch active" id="themeToggle"></div>
            </div>

            <!-- Notifications -->
            <div class="settings-item" id="notifToggleItem">
                <div class="settings-item-left">
                    <div class="icon-wrapper">
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                    </div>
                    <span>Notifications</span>
                </div>
                <div class="toggle-switch" id="notifToggle"></div>
            </div>
        </div>

        <!-- Data & Storage -->
        <div class="settings-group">
            <div class="settings-group-title">Data & Storage</div>
            
            <!-- Clear Watchlist -->
            <div class="settings-item btn-danger" id="clearWatchlistBtn">
                <div class="settings-item-left">
                    <div class="icon-wrapper danger-icon">
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </div>
                    <span>Clear Watchlist</span>
                </div>
            </div>

            <!-- Clear Cache -->
            <div class="settings-item" id="clearCacheBtn">
                <div class="settings-item-left">
                    <div class="icon-wrapper">
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </div>
                    <span>Clear Cache</span>
                </div>
            </div>
        </div>

        <!-- About -->
        <div class="settings-group">
            <div class="settings-group-title">About</div>
            
            <div class="settings-item">
                <div class="settings-item-left">
                    <div class="icon-wrapper">
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <span>App Version</span>
                </div>
                <span class="version-text">v1.0.0</span>
            </div>

            <div class="settings-item">
                <div class="settings-item-left">
                    <div class="icon-wrapper">
                        <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <span>Privacy Policy</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="var(--text-muted)" style="width: 20px; height: 20px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </div>
        </div>

    </main>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Home</span>
        </a>
        
        <a href="index.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
            </svg>
            <span>Search</span>
        </a>

        <a href="watchlist.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            <span>Watchlist</span>
        </a>

        <a href="settings.html" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Settings Script -->
    <script src="settings.js"></script>
</body>
</html>
