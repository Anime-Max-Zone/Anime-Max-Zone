<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Anime Max Zone</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Main CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="watch-page-body">

    <!-- Header Section (Sticky) -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">
                <h1>ANIME <span class="purple-text">MAX</span> ZONE</h1>
                <p>Watch Your Favourite Anime</p>
            </div>
        </div>
        <div class="search-area" id="openSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></div>
    </header>

    <!-- Search Overlay Panel -->
    <div class="search-overlay" id="searchPanel">
        <div class="search-header">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search anime..." autocomplete="off">
            </div>
            <button class="cancel-btn" id="closeSearchBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="search-results" id="searchResults"><p class="search-hint">Start typing to search...</p></div>
    </div>

    <!-- Main Content: Video Player -->
    <main class="main-content">
        <!-- Video Player Wrapper -->
        <div class="player-wrapper" id="playerWrapper">
            
            <!-- Top Controls Wrapper (Back Button & Top Right Icons) -->
            <div id="topControls" class="top-controls">
                <!-- Top Left Back Button -->
                <a href="javascript:history.back()" class="player-back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></a>

                <!-- Top Right Icons (Audio & Subtitle) -->
                <div class="top-right-controls" id="topRightIcons">
                    <button id="audioIconBtn" class="top-icon-btn" title="Audio Track"><i class="fa-solid fa-headphones"></i></button>
                    <button id="subtitleIconBtn" class="top-icon-btn" title="Subtitles"><i class="fa-solid fa-closed-captioning"></i></button>
                </div>
            </div>

            <!-- Audio Menu (Top Right) -->
            <div id="audioMenu" class="top-settings-menu" style="display: none;">
                <h4>Audio Track</h4>
                <div id="audioOptions" class="settings-options"></div>
            </div>

            <!-- Subtitle Menu (Top Right) -->
            <div id="subtitleMenu" class="top-settings-menu" style="display: none;">
                <h4>Subtitles</h4>
                <div id="subtitleOptions" class="settings-options"></div>
            </div>

            <!-- TAP OVERLAYS (Double Tap Feature & Single Tap Show/Hide) -->
            <div id="seekLeftOverlay" class="tap-overlay left-tap">
                <div class="tap-feedback"><i class="fa-solid fa-backward"></i> 10s</div>
            </div>
            <div id="centerOverlay" class="tap-overlay center-tap">
                <div class="tap-feedback" id="centerFeedbackIcon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div id="seekRightOverlay" class="tap-overlay right-tap">
                <div class="tap-feedback"><i class="fa-solid fa-forward"></i> 10s</div>
            </div>

            <!-- HTML5 Video Tag -->
            <video id="customVideo" playsinline crossorigin="anonymous">
                <track id="subtitleTrack" label="Subtitles" kind="subtitles" srclang="en" default>
            </video>

            <!-- Loading Spinner -->
            <div class="loading-spinner" id="videoLoader"><i class="fa-solid fa-spinner fa-spin"></i></div>

            <!-- Quality Menu (Bottom Right) -->
            <div id="qualityMenu" class="settings-menu" style="display: none;">
                <h4>Quality</h4>
                <div id="qualityOptions" class="settings-options"></div>
            </div>

            <!-- Custom Controller Overlay -->
            <div class="custom-controls" id="controlsBar">
                <div class="progress-container">
                    <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
                </div>
                <div class="controls-row">
                    <div class="left-controls">
                        <button id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                        <button id="muteBtn"><i class="fa-solid fa-volume-high"></i></button>
                        <span id="timeDisplay">0:00 / 0:00</span>
                    </div>
                    <div class="right-controls">
                        <button id="skipBackBtn"><i class="fa-solid fa-rotate-left"></i> 10s</button>
                        <button id="skipForwardBtn">10s <i class="fa-solid fa-rotate-right"></i></button>
                        <button id="settingsBtn"><i class="fa-solid fa-gear"></i></button>
                        <button id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Video Info & Episodes Section -->
        <div class="video-info-section" style="padding: 15px; color: #fff;">
            <h2 id="watchAnimeTitle" style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Now Playing</h2>
            <p id="watchAnimeDesc" style="font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 20px;">
                Loading description...
            </p>

            <!-- Comments Trigger Button -->
            <button id="openCommentsBtn" class="comment-trigger-btn">
                <i class="fa-regular fa-comments"></i> View Comments
            </button>

            <!-- Seasons & Episodes Container -->
            <div id="seasonsEpisodesWrapper" style="display: none; margin-top: 20px; border-top: 1px solid #1a1a24; padding-top: 15px;">
                <div class="season-tabs" id="watchSeasonTabs"></div>
                <div class="episode-list" id="watchEpisodeList"></div>
            </div>
        </div>
    </main>

    <!-- Animated Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="anime.html" class="nav-item"><i class="fa-solid fa-face-smile"></i><span>Anime</span></a>
        <a href="movies.html" class="nav-item"><i class="fa-solid fa-clapperboard"></i><span>Movies</span></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
    </nav>

    <!-- ================= COMMENTS BOTTOM SHEET ================= -->
    <div id="bottomSheetBackdrop" class="bottom-sheet-backdrop"></div>

    <div id="commentsBottomSheet" class="bottom-sheet">
        <div class="bottom-sheet-drag-handle"></div>
        
        <div class="bottom-sheet-header">
            <h3><i class="fa-regular fa-comments"></i> Comments</h3>
            <button id="closeCommentsBtn" class="bottom-sheet-close"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="bottom-sheet-content">
            <form id="commentForm" class="comment-form" onsubmit="return false;">
                <div class="form-row">
                    <input type="text" id="commentName" placeholder="Your Name" required>
                    <input type="email" id="commentEmail" placeholder="Your Gmail" required>
                </div>
                <textarea id="commentText" rows="2" placeholder="Write your comment here..." required></textarea>
                <button type="submit" class="submit-comment-btn"><i class="fa-solid fa-paper-plane"></i> Post Comment</button>
            </form>

            <div id="commentsList" class="comments-list">
                <p style="color: #888; font-size: 13px; text-align: center;">Loading comments...</p>
            </div>
        </div>
    </div>
    <!-- ========================================================= -->

    <!-- ================= CUSTOM DELETE CONFIRM MODAL ================= -->
    <div id="customConfirmModal" class="custom-modal-overlay" style="display: none;">
        <div class="custom-modal-box">
            <div class="custom-modal-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Delete Comment</h3>
            <p id="confirmMessage">Are you sure you want to delete this comment?</p>
            <div class="custom-modal-actions">
                <button id="confirmNoBtn" class="modal-btn cancel-btn">Cancel</button>
                <button id="confirmYesBtn" class="modal-btn delete-btn">Delete</button>
            </div>
        </div>
    </div>
    <!-- =============================================================== -->

    <script src="script.js" defer></script>
</body>
</html>
