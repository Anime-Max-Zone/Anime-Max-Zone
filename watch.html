<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <meta name="description" content="Watch anime episodes on Anime Max Zone.">

  <title>Watch Anime | Anime Max Zone</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .watch-page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 15px 100px;
    }

    .watch-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      border: 1px solid #30303e;
      border-radius: 9px;
      background: #171720;
      color: #fff;
      font-size: 13px;
      text-decoration: none;
    }

    .watch-brand {
      color: #bba0ff;
      font-size: 15px;
      font-weight: 800;
    }

    .video-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid #292938;
      border-radius: 15px;
      background: #000;
    }

    .video-container video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(0, 0, 0, 0.72);
      color: #ddd;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }

    .video-message[hidden] {
      display: none;
    }

    .watch-details {
      margin-top: 22px;
    }

    .episode-label {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 7px;
      background: #261a40;
      color: #cbb4ff;
      font-size: 11px;
      font-weight: 700;
    }

    .episode-title {
      margin: 0 0 10px;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .episode-description {
      margin: 0;
      color: #aaaabb;
      font-size: 14px;
      line-height: 1.8;
    }

    .episode-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid #343445;
      border-radius: 10px;
      background: #181821;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action-button.primary {
      border-color: #7c3cff;
      background: #7c3cff;
    }

    .action-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .episodes-section {
      margin-top: 35px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .episodes-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .episode-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 13px;
      border: 1px solid #292938;
      border-radius: 12px;
      background: #14141d;
      color: #fff;
      text-decoration: none;
    }

    .episode-item.active {
      border-color: #8b5aff;
      background: #211833;
    }

    .episode-number {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 9px;
      background: #2a2239;
      color: #cbb4ff;
      font-size: 13px;
      font-weight: 800;
    }

    .episode-item-title {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 24px;
      border: 1px dashed #353545;
      border-radius: 12px;
      color: #aaaabb;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 600px) {
      .watch-page {
        padding: 12px 10px 90px;
      }

      .video-container {
        margin-right: -10px;
        margin-left: -10px;
        width: calc(100% + 20px);
        border-right: 0;
        border-left: 0;
        border-radius: 0;
      }

      .watch-brand {
        font-size: 13px;
      }

      .episodes-list {
        grid-template-columns: 1fr;
      }

      .action-button {
        flex: 1;
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>
  <main class="watch-page">

    <header class="watch-topbar">
      <a class="back-link" id="backLink" href="index.html">
        <span aria-hidden="true">←</span> Back
      </a>

      <span class="watch-brand">ANIME MAX ZONE</span>
    </header>

    <section aria-label="Anime video player">
      <div class="video-container" id="videoContainer">
        <video
          id="animeVideo"
          controls
          playsinline
          preload="metadata"
          controlsList="nodownload"
        >
          Your browser does not support HTML5 video.
        </video>

        <div class="video-message" id="videoMessage">
          Loading episode...
        </div>
      </div>
    </section>

    <section class="watch-details">
      <span class="episode-label" id="episodeLabel">ANIME EPISODE</span>

      <h1 class="episode-title" id="episodeTitle">
        Loading episode...
      </h1>

      <p class="episode-description" id="episodeDescription">
        Get ready to watch your episode.
      </p>

      <div class="episode-actions">
        <button class="action-button" id="previousButton" type="button">
          ← Previous
        </button>

        <button class="action-button primary" id="nextButton" type="button">
          Next Episode →
        </button>

        <button class="action-button" id="fullscreenButton" type="button">
          ⛶ Fullscreen
        </button>
      </div>
    </section>

    <section class="episodes-section">
      <h2 class="section-title">Episodes</h2>
      <div class="episodes-list" id="episodesList">
        <div class="empty-state">Loading episodes...</div>
      </div>
    </section>

  </main>

  <script>
    (function () {
      "use strict";

      var video = document.getElementById("animeVideo");
      var videoContainer = document.getElementById("videoContainer");
      var videoMessage = document.getElementById("videoMessage");
      var episodeTitle = document.getElementById("episodeTitle");
      var episodeLabel = document.getElementById("episodeLabel");
      var episodeDescription = document.getElementById("episodeDescription");
      var episodesList = document.getElementById("episodesList");
      var previousButton = document.getElementById("previousButton");
      var nextButton = document.getElementById("nextButton");
      var fullscreenButton = document.getElementById("fullscreenButton");

      /*
       * DEMO DATA
       *
       * Replace the sample video URLs with videos you own
       * or are authorized to stream.
       *
       * Supported direct video formats depend on the browser.
       */
      var animeDatabase = {
        "one-piece": {
          title: "One Piece",
          description: "Watch this episode of One Piece.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        },

        "naruto-shippuden": {
          title: "Naruto Shippuden",
          description: "Watch this episode of Naruto Shippuden.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        },

        "attack-on-titan": {
          title: "Attack on Titan",
          description: "Watch this episode of Attack on Titan.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        },

        "demon-slayer": {
          title: "Demon Slayer",
          description: "Watch this episode of Demon Slayer.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        },

        "jujutsu-kaisen": {
          title: "Jujutsu Kaisen",
          description: "Watch this episode of Jujutsu Kaisen.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        },

        "solo-leveling": {
          title: "Solo Leveling",
          description: "Watch this episode of Solo Leveling.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        },

        "blue-lock": {
          title: "Blue Lock",
          description: "Watch this episode of Blue Lock.",
          seasons: [{
            name: "Season 1",
            episodes: [
              {
                title: "Episode 1",
                url: "",
                number: 1
              },
              {
                title: "Episode 2",
                url: "",
                number: 2
              }
            ]
          }]
        }
      };

      var params = new URLSearchParams(window.location.search);
      var animeId = params.get("id") || "";
      var seasonIndex = Math.max(0, parseInt(params.get("season") || "1", 10) - 1);
      var episodeIndex = Math.max(0, parseInt(params.get("episode") || "1", 10) - 1);

      var anime = animeDatabase[animeId];
      var currentEpisodes = [];

      function showMessage(message) {
        videoMessage.textContent = message;
        videoMessage.hidden = false;
      }

      function hideMessage() {
        videoMessage.hidden = true;
      }

      function getEpisodeURL(value) {
        if (typeof value !== "string" || !value.trim()) {
          return "";
        }

        try {
          var parsed = new URL(value, window.location.href);

          if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
            return "";
          }

          return parsed.href;
        } catch (error) {
          return "";
        }
      }

      function navigateToEpisode(index) {
        if (!currentEpisodes.length || index < 0 || index >= currentEpisodes.length) {
          return;
        }

        window.location.href =
          "watch.html?id=" + encodeURIComponent(animeId) +
          "&season=" + encodeURIComponent(seasonIndex + 1) +
          "&episode=" + encodeURIComponent(index + 1);
      }

      function renderEpisodes() {
        episodesList.innerHTML = "";

        currentEpisodes.forEach(function (episode, index) {
          var link = document.createElement("a");
          link.className = "episode-item" + (index === episodeIndex ? " active" : "");
          link.href = "watch.html?id=" + encodeURIComponent(animeId) +
            "&season=" + encodeURIComponent(seasonIndex + 1) +
            "&episode=" + encodeURIComponent(index + 1);

          var number = document.createElement("span");
          number.className = "episode-number";
          number.textContent = String(index + 1).padStart(2, "0");

          var title = document.createElement("p");
          title.className = "episode-item-title";
          title.textContent = episode.title || ("Episode " + (index + 1));

          link.appendChild(number);
          link.appendChild(title);
          episodesList.appendChild(link);
        });

        if (!currentEpisodes.length) {
          var empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "No episodes are available yet.";
          episodesList.appendChild(empty);
        }
      }

      function loadEpisode() {
        var season = anime.seasons && anime.seasons[seasonIndex];

        if (!season) {
          showMessage("This season is not available.");
          return;
        }

        currentEpisodes = Array.isArray(season.episodes) ? season.episodes : [];

        if (!currentEpisodes.length) {
          showMessage("No episodes have been added to this season yet.");
          renderEpisodes();
          return;
        }

        if (episodeIndex >= currentEpisodes.length) {
          episodeIndex = 0;
        }

        var episode = currentEpisodes[episodeIndex];

        episodeTitle.textContent = anime.title + " — " +
          (episode.title || ("Episode " + (episodeIndex + 1)));

        episodeLabel.textContent =
          season.name + " · Episode " + (episodeIndex + 1);

        episodeDescription.textContent = anime.description || "Enjoy the episode.";

        previousButton.disabled = episodeIndex <= 0;
        nextButton.disabled = episodeIndex >= currentEpisodes.length - 1;

        renderEpisodes();

        var videoURL = getEpisodeURL(episode.url);

        video.pause();
        video.removeAttribute("src");
        video.load();

        if (!videoURL) {
          showMessage("Video URL is not configured for this episode yet. Add your authorized direct video URL to the episode data.");
          return;
        }

        showMessage("Loading video...");

        video.src = videoURL;
        video.load();
      }

      video.addEventListener("loadedmetadata", function () {
        hideMessage();
      });

      video.addEventListener("playing", function () {
        hideMessage();
      });

      video.addEventListener("waiting", function () {
        showMessage("Buffering video...");
      });

      video.addEventListener("error", function () {
        showMessage("Video could not be played. Check the video URL, access permissions, supported format and server CORS settings.");
      });

      previousButton.addEventListener("click", function () {
        navigateToEpisode(episodeIndex - 1);
      });

      nextButton.addEventListener("click", function () {
        navigateToEpisode(episodeIndex + 1);
      });

      fullscreenButton.addEventListener("click", function () {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (videoContainer.requestFullscreen) {
          videoContainer.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      });

      video.addEventListener("ended", function () {
        if (episodeIndex < currentEpisodes.length - 1) {
          nextButton.focus();
        }
      });

      if (!anime) {
        episodeTitle.textContent = "Anime Not Found";
        episodeDescription.textContent =
          "This anime is not available in the demo database.";
        previousButton.disabled = true;
        nextButton.disabled = true;
        showMessage("Anime not found. Return to the home page and select an anime.");
        episodesList.innerHTML = "";

        var back = document.createElement("a");
        back.className = "episode-item";
        back.href = "index.html";
        back.textContent = "← Back to Home";
        episodesList.appendChild(back);
      } else {
        document.title = "Watch " + anime.title + " | Anime Max Zone";
        loadEpisode();
      }
    })();
  </script>
</body>
</html>
