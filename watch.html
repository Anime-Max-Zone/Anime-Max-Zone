<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loading... — Anime Max Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- Plyr Video Player CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="watch.css" />
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <a href="index.html" class="logo-link" aria-label="Anime Max Zone Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" class="nav-logo-svg">
                <defs>
                    <linearGradient id="maxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#e2a0ff" />
                        <stop offset="50%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#7e22ce" />
                    </linearGradient>
                </defs>
                <g font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="180" letter-spacing="2" dominant-baseline="central">
                    <text x="50" y="150" fill="#ffffff">ANIME</text>
                    <text x="740" y="150" fill="url(#maxGradient)" class="animated-max-text">MAX</text>
                </g>
            </svg>
        </a>
        <div class="nav-actions">
            <button class="btn-icon" id="openSearchBtn" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" /></svg>
            </button>
        </div>
    </header>

    <!-- ================= SEARCH OVERLAY PANEL ================= -->
    <div id="searchOverlay" class="search-overlay">
        <div class="search-panel">
            <div class="search-logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" class="search-logo-svg">
                    <defs>
                        <linearGradient id="maxGradientSearch" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#e2a0ff" />
                            <stop offset="50%" stop-color="#a855f7" />
                            <stop offset="100%" stop-color="#7e22ce" />
                        </linearGradient>
                    </defs>
                    <g font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="180" letter-spacing="2" dominant-baseline="central">
                        <text x="50" y="150" fill="#ffffff">ANIME</text>
                        <text x="740" y="150" fill="url(#maxGradientSearch)" class="animated-max-text">MAX</text>
                    </g>
                </svg>
            </div>
            <div class="search-header">
                <div class="search-input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" /></svg>
                    <input id="searchInput" type="search" placeholder="Search anime, genres..." autocomplete="off" />
                </div>
                <button id="closeSearchBtn" class="btn-close" aria-label="Close search">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="liveSuggestions" class="live-suggestions"></div>
        </div>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="watch-container">
        
        <!-- STICKY VIDEO WRAPPER -->
        <div class="sticky-video-wrap">
            
            <!-- NATIVE PLAYER WITH CUSTOM UI -->
            <div class="video-container" id="nativePlayerContainer" style="display: none;">
                <!-- Video Element (No crossorigin) -->
                <video id="videoPlayer" playsinline></video>
                
                <!-- CUSTOM CONTROLS OVERLAY -->
                <div class="custom-video-ui" id="customVideoUI">
                    <!-- Center Play Button -->
                    <div class="center-play-btn" id="centerPlayBtn">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>

                    <!-- Bottom Control Bar -->
                    <div class="bottom-controls">
                        <div class="progress-container">
                            <input type="range" id="customProgressBar" min="0" max="100" value="0" step="0.1">
                        </div>
                        <div class="controls-row">
                            <div class="left-controls">
                                <button id="customPlayBtn">
                                    <svg id="customPlayIcon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                                </button>
                                <span class="time-display">
                                    <span id="customCurrentTime">0:00</span> / <span id="customDuration">0:00</span>
                                </span>
                            </div>
                            <div class="right-controls">
                                <button id="customMuteBtn">
                                    <svg id="customMuteIcon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                </button>
                                <button id="customSettingsBtn">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                                </button>
                                <button id="customFullScreenBtn">
                                    <svg id="customFullScreenIcon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- IFRAME PLAYER (For Embeds / GDrive) -->
            <div class="video-container iframe-wrapper" id="iframePlayerContainer" style="display: none;">
                <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Episode Info -->
        <div class="watch-info" id="watchInfo" style="display: none;">
            <div class="info-header">
                <div class="title-group">
                    <a id="animeLink" class="anime-name" href="#">Anime Name</a>
                    <span class="separator">•</span>
                    <span id="episodeTitle" class="episode-title">Episode 1</span>
                </div>
                
                <!-- SEASON & EPISODE BUTTONS -->
                <div class="selector-buttons" id="seasonEpisodeWrapper">
                    <button class="select-btn" id="seasonBtn">
                        <span class="btn-text" id="currentSeasonText">Season 1</span>
                        <span class="btn-icon-wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                        </span>
                    </button>
                    <button class="select-btn" id="episodeBtn">
                        <span class="btn-text" id="currentEpisodeText">Episode 1</span>
                        <span class="btn-icon-wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= RELATED ANIME SECTION ================= -->
        <section class="related-section" id="relatedSection" style="display: none;">
            <div class="section-header">
                <h2>Related Anime</h2>
            </div>
            <div class="anime-grid" id="relatedGrid"></div>
        </section>

        <!-- Error Message -->
        <div id="errorMessage" style="display: none; text-align: center; padding: 4rem 1rem;">
            <h2 style="color: #ff6b6b; margin-bottom: 1rem;">Video Not Found</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">The episode you are looking for does not exist or has been removed.</p>
            <a href="index.html" class="btn-primary">Go Back Home</a>
        </div>

    </main>

    <!-- ================= BOTTOM SHEET (Episodes) ================= -->
    <div id="bottomSheetOverlay" class="bottom-sheet-overlay">
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-handle" id="sheetHandle"></div>
            <div class="sheet-header">
                <h3 id="sheetTitle">Select Episode</h3>
                <button id="closeSheetBtn" class="btn-close" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="sheet-content" id="sheetContent"></div>
        </div>
    </div>

    <!-- ================= PLAYER SETTINGS BOTTOM SHEET ================= -->
    <div id="settingsSheetOverlay" class="bottom-sheet-overlay">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h3>Player Settings</h3>
                <button id="closeSettingsBtn" class="btn-close">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="sheet-content" id="settingsContent"></div>
        </div>
    </div>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
            <span>Home</span>
        </a>
        <button class="nav-item" id="navSearchBtn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" /></svg>
            <span>Search</span>
        </button>
        <a href="watchlist.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
            <span>Watchlist</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <!-- CUSTOM PLAYER JS -->
    <script src="custom-player.js"></script>
    
    <!-- Watch Page Script -->
    <script type="module" src="watch.js"></script>
</body>
</html>
