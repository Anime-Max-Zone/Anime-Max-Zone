<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Anime - Anime Max Zone</title>
  <meta name="description" content="Watch anime online on Anime Max Zone.">
  <meta name="theme-color" content="#080811">

  <link rel="stylesheet" href="watch.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">Anime Max Zone</a>

    <nav class="header-actions" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="anime.html">Anime</a>
    </nav>
  </header>

  <main class="watch-page">
    <!-- Video Player -->
    <section class="watch-player-section" aria-label="Anime video player">
      <div class="video-container">

        <!-- Native video player for direct video sources only -->
        <div id="nativePlayerContainer" hidden>
          <video
            id="videoPlayer"
            playsinline
            preload="metadata"
          ></video>
        </div>

        <!-- Google Drive preview player -->
        <div id="iframePlayerContainer" hidden>
          <iframe
            id="videoIframe"
            title="Anime video player"
            src="about:blank"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>

        <!-- Loading / error message -->
        <div id="playerMessage" role="status" aria-live="polite">
          Loading video...
        </div>
      </div>
    </section>

    <!-- Anime Information -->
    <section class="anime-information">
      <div class="anime-heading">
        <div>
          <h1 id="animeTitle">Loading anime...</h1>
          <p id="episodeTitle">Please wait</p>
        </div>

        <button id="watchBookmarkBtn" type="button" hidden>
          Add to List
        </button>
      </div>

      <div class="anime-meta">
        <span id="animeType"></span>
        <span id="animeStatus"></span>
        <span id="animeRating"></span>
      </div>

      <p id="animeDescription"></p>
    </section>

    <!-- Season and Episode Selector -->
    <section class="episode-section">
      <div class="section-heading">
        <h2>Episodes</h2>
      </div>

      <div class="episode-controls">
        <label for="seasonSelect">Season</label>
        <select id="seasonSelect">
          <option value="">Select season</option>
        </select>
      </div>

      <div id="episodeList" class="episode-list">
        <!-- Episodes are rendered by watch.js -->
      </div>

      <div class="episode-navigation">
        <button id="previousEpisodeBtn" type="button" disabled>
          Previous Episode
        </button>

        <button id="nextEpisodeBtn" type="button" disabled>
          Next Episode
        </button>
      </div>
    </section>

    <!-- Related Anime -->
    <section class="related-section">
      <div class="section-heading">
        <h2>Related Anime</h2>
      </div>

      <div id="relatedAnimeList" class="related-anime-list">
        <!-- Related anime cards are rendered by watch.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="currentYear"></span> Anime Max Zone</p>
  </footer>

  <script>
    document.getElementById("currentYear").textContent =
      new Date().getFullYear();
  </script>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <!-- Your existing Firebase configuration -->
  <script src="firebase-config.js"></script>

  <!-- Existing player and watch-page logic -->
  <script src="custom-player.js"></script>
  <script src="watch.js"></script>
</body>
</html>
