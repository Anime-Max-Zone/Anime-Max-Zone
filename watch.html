<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loading... — Anime Max Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- Plyr Video Player CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="watch.css" />
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <a href="index.html" class="logo-link" aria-label="Anime Max Zone Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" class="nav-logo-svg">
                <defs>
                    <linearGradient id="maxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#e2a0ff" />
                        <stop offset="50%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#7e22ce" />
                    </linearGradient>
                </defs>
                <g font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="180" letter-spacing="2" dominant-baseline="central">
                    <text x="50" y="150" fill="#ffffff">ANIME</text>
                    <text x="740" y="150" fill="url(#maxGradient)" class="animated-max-text">MAX</text>
                </g>
            </svg>
        </a>
        <div class="nav-actions">
            <button class="btn-icon" id="openSearchBtn" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" /></svg>
            </button>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="watch-container">
        
        <!-- STICKY VIDEO WRAPPER -->
        <div class="sticky-video-wrap">
            <div id="playerLoading" class="video-container skeleton"></div>
            <div class="video-container" id="nativePlayerContainer" style="display: none;">
                <video id="videoPlayer" playsinline controls crossorigin></video>
            </div>
            <div class="video-container iframe-wrapper" id="iframePlayerContainer" style="display: none;">
                <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Episode Info -->
        <div class="watch-info" id="watchInfo" style="display: none;">
            <div class="info-header">
                <div class="title-group">
                    <a id="animeLink" class="anime-name" href="#">Anime Name</a>
                    <span class="separator">•</span>
                    <span id="episodeTitle" class="episode-title">Episode 1</span>
                </div>
                
                <!-- SEASON & EPISODE BUTTONS -->
                <div class="selector-buttons" id="seasonEpisodeWrapper">
                    <button class="select-btn" id="seasonBtn">
                        <span class="btn-text" id="currentSeasonText">Season 1</span>
                        <span class="btn-icon-wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                        </span>
                    </button>
                    <button class="select-btn" id="episodeBtn">
                        <span class="btn-text" id="currentEpisodeText">Episode 1</span>
                        <span class="btn-icon-wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= RELATED ANIME SECTION ================= -->
        <section class="related-section" id="relatedSection" style="display: none;">
            <div class="section-header">
                <h2>Related Anime</h2>
            </div>
            <div class="anime-grid" id="relatedGrid"></div>
        </section>

        <!-- Error Message -->
        <div id="errorMessage" style="display: none; text-align: center; padding: 4rem 1rem;">
            <h2 style="color: #ff6b6b; margin-bottom: 1rem;">Video Not Found</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">The episode you are looking for does not exist or has been removed.</p>
            <a href="index.html" class="btn-primary">Go Back Home</a>
        </div>

    </main>

    <!-- ================= BOTTOM SHEET OVERLAY ================= -->
    <div id="bottomSheetOverlay" class="bottom-sheet-overlay">
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h3 id="sheetTitle">Select Episode</h3>
                <button id="closeSheetBtn" class="btn-close" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="sheet-content" id="sheetContent"></div>
        </div>
    </div>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
            <span>Home</span>
        </a>
        <button class="nav-item" id="navSearchBtn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" /></svg>
            <span>Search</span>
        </button>
        <a href="watchlist.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
            <span>Watchlist</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script type="module" src="watch.js"></script>
</body>
</html>
