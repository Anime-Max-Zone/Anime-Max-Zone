<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#08080d">
    <meta name="description" content="Watch your favourite anime on Anime Max Zone.">

    <title id="pageTitle">Anime Max Zone</title>

    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <!-- Existing stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="watch-page-body">

    <!-- ================= HEADER ================= -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>

            <div class="logo-text">
                <h1>ANIME <span class="purple-text">MAX</span> ZONE</h1>
                <p>Watch Your Favourite Anime</p>
            </div>
        </div>

        <button
            type="button"
            class="search-area"
            id="openSearchBtn"
            aria-label="Search anime">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </header>

    <!-- ================= SEARCH OVERLAY ================= -->
    <section
        class="search-overlay"
        id="searchPanel"
        aria-label="Anime search">

        <div class="search-header">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search anime..."
                    autocomplete="off">
            </div>

            <button
                type="button"
                class="cancel-btn"
                id="closeSearchBtn"
                aria-label="Close search">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="search-results" id="searchResults">
            <p class="search-hint">Start typing to search...</p>
        </div>
    </section>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <!-- ================= VIDEO PLAYER ================= -->
        <section class="player-wrapper" id="playerWrapper">

            <!-- Top controls -->
            <div id="topControls" class="top-controls">

                <a
                    href="javascript:history.back()"
                    class="player-back-btn"
                    id="backBtn"
                    aria-label="Go back">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="top-right-controls" id="topRightIcons">

                    <button
                        type="button"
                        id="audioIconBtn"
                        class="top-icon-btn"
                        title="Audio Track"
                        aria-label="Select audio track"
                        aria-expanded="false">
                        <i class="fa-solid fa-headphones"></i>
                    </button>

                    <button
                        type="button"
                        id="subtitleIconBtn"
                        class="top-icon-btn"
                        title="Subtitles"
                        aria-label="Select subtitles"
                        aria-expanded="false">
                        <i class="fa-solid fa-closed-captioning"></i>
                    </button>

                </div>
            </div>

            <!-- Audio menu -->
            <div
                id="audioMenu"
                class="top-settings-menu"
                style="display:none;"
                role="dialog"
                aria-label="Audio Track">

                <h4>Audio Track</h4>
                <div id="audioOptions" class="settings-options"></div>
            </div>

            <!-- Subtitle menu -->
            <div
                id="subtitleMenu"
                class="top-settings-menu"
                style="display:none;"
                role="dialog"
                aria-label="Subtitles">

                <h4>Subtitles</h4>
                <div id="subtitleOptions" class="settings-options"></div>
            </div>

            <!-- Tap feedback overlays -->
            <div id="seekLeftOverlay" class="tap-overlay left-tap">
                <div class="tap-feedback">
                    <i class="fa-solid fa-backward"></i> 10s
                </div>
            </div>

            <div id="centerOverlay" class="tap-overlay center-tap">
                <div class="tap-feedback" id="centerFeedbackIcon">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

            <div id="seekRightOverlay" class="tap-overlay right-tap">
                <div class="tap-feedback">
                    <i class="fa-solid fa-forward"></i> 10s
                </div>
            </div>

            <!-- Video element -->
            <video
                id="customVideo"
                playsinline
                webkit-playsinline
                preload="metadata"
                crossorigin="anonymous">

                <track
                    id="subtitleTrack"
                    label="Subtitles"
                    kind="subtitles"
                    srclang="en">
            </video>

            <!-- Loading indicator -->
            <div
                class="loading-spinner"
                id="videoLoader"
                role="status"
                aria-label="Loading video">

                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>

            <!-- Quality menu -->
            <div
                id="qualityMenu"
                class="settings-menu"
                style="display:none;"
                role="dialog"
                aria-label="Video Quality">

                <h4>Quality</h4>
                <div id="qualityOptions" class="settings-options"></div>
            </div>

            <!-- Player controls -->
            <div class="custom-controls" id="controlsBar">

                <div class="progress-container">
                    <input
                        type="range"
                        id="seekBar"
                        value="0"
                        min="0"
                        max="100"
                        step="0.1"
                        aria-label="Video progress">
                </div>

                <div class="controls-row">

                    <div class="left-controls">

                        <button
                            type="button"
                            id="playPauseBtn"
                            aria-label="Play or pause">
                            <i class="fa-solid fa-play"></i>
                        </button>

                        <button
                            type="button"
                            id="muteBtn"
                            aria-label="Mute or unmute">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>

                        <span id="timeDisplay">0:00 / 0:00</span>
                    </div>

                    <div class="right-controls">

                        <button type="button" id="skipBackBtn">
                            <i class="fa-solid fa-rotate-left"></i> 10s
                        </button>

                        <button type="button" id="skipForwardBtn">
                            10s <i class="fa-solid fa-rotate-right"></i>
                        </button>

                        <button
                            type="button"
                            id="settingsBtn"
                            aria-label="Playback settings"
                            title="Settings">
                            <i class="fa-solid fa-gear"></i>
                        </button>

                        <button
                            type="button"
                            id="fullscreenBtn"
                            aria-label="Fullscreen"
                            title="Fullscreen">
                            <i class="fa-solid fa-expand"></i>
                        </button>

                    </div>
                </div>
            </div>

        </section>

        <!-- ================= VIDEO INFORMATION ================= -->
        <section class="video-info-section"
                 style="padding:15px;color:#fff;">

            <h2
                id="watchAnimeTitle"
                style="font-size:20px;font-weight:600;margin-bottom:8px;">
                Now Playing
            </h2>

            <p
                id="watchAnimeDesc"
                style="font-size:13px;color:#aaa;line-height:1.5;margin-bottom:20px;">
                Loading description...
            </p>

            <!-- Comments -->
            <button
                type="button"
                id="openCommentsBtn"
                class="comment-trigger-btn">

                <i class="fa-regular fa-comments"></i>
                View Comments
            </button>

            <!-- Seasons and episodes -->
            <div
                id="seasonsEpisodesWrapper"
                style="display:none;margin-top:20px;border-top:1px solid #1a1a24;padding-top:15px;">

                <div class="season-tabs" id="watchSeasonTabs"></div>
                <div class="episode-list" id="watchEpisodeList"></div>
            </div>

        </section>
    </main>

    <!-- ================= BOTTOM NAVIGATION ================= -->
    <nav class="bottom-nav" aria-label="Main navigation">

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="anime.html" class="nav-item">
            <i class="fa-solid fa-face-smile"></i>
            <span>Anime</span>
        </a>

        <a href="movies.html" class="nav-item">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Movies</span>
        </a>

        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>

    </nav>

    <!-- ================= COMMENTS BACKDROP ================= -->
    <div
        id="bottomSheetBackdrop"
        class="bottom-sheet-backdrop">
    </div>

    <!-- ================= COMMENTS BOTTOM SHEET ================= -->
    <section
        id="commentsBottomSheet"
        class="bottom-sheet"
        role="dialog"
        aria-label="Comments"
        aria-modal="true">

        <div class="bottom-sheet-drag-handle"></div>

        <div class="bottom-sheet-header">

            <h3>
                <i class="fa-regular fa-comments"></i>
                Comments
            </h3>

            <button
                type="button"
                id="closeCommentsBtn"
                class="bottom-sheet-close"
                aria-label="Close comments">

                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div class="bottom-sheet-content">

            <form
                id="commentForm"
                class="comment-form"
                onsubmit="return false;">

                <div class="form-row">

                    <input
                        type="text"
                        id="commentName"
                        placeholder="Your Name"
                        autocomplete="name"
                        required>

                    <input
                        type="email"
                        id="commentEmail"
                        placeholder="Your Gmail"
                        autocomplete="email"
                        required>

                </div>

                <textarea
                    id="commentText"
                    rows="2"
                    placeholder="Write your comment here..."
                    required></textarea>

                <button
                    type="submit"
                    class="submit-comment-btn">

                    <i class="fa-solid fa-paper-plane"></i>
                    Post Comment
                </button>

            </form>

            <div id="commentsList" class="comments-list">
                <p style="color:#888;font-size:13px;text-align:center;">
                    Loading comments...
                </p>
            </div>

        </div>
    </section>

    <!-- ================= DELETE CONFIRMATION ================= -->
    <div
        id="customConfirmModal"
        class="custom-modal-overlay"
        style="display:none;">

        <div class="custom-modal-box">

            <div class="custom-modal-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <h3>Delete Comment</h3>

            <p id="confirmMessage">
                Are you sure you want to delete this comment?
            </p>

            <div class="custom-modal-actions">

                <button
                    type="button"
                    id="confirmNoBtn"
                    class="modal-btn cancel-btn">
                    Cancel
                </button>

                <button
                    type="button"
                    id="confirmYesBtn"
                    class="modal-btn delete-btn">
                    Delete
                </button>

            </div>
        </div>
    </div>

    <!-- Existing player logic -->
    <script src="script.js" defer></script>

</body>
</html>
