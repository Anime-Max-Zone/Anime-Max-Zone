<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Anime - Anime Max Zone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>
            <div class="logo-text">
                <h1>ANIME <span class="purple-text">MAX</span> ZONE</h1>
                <p>Watch Your Favourite Anime</p>
            </div>
        </div>
        <div class="search-area" id="openSearchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- Search Overlay Panel -->
    <div class="search-overlay" id="searchPanel">
        <div class="search-header">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search anime, movies, cartoons..." autocomplete="off">
            </div>
            <button class="cancel-btn" id="closeSearchBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="search-results" id="searchResults">
            <p class="search-hint">Start typing to search...</p>
        </div>
    </div>

    <!-- Main Content: Anime Grid -->
    <main class="main-content">
        <div class="section-title" style="margin-top: 10px;">
            <div class="title-left">
                <span class="vertical-bar"></span>
                <h2>All Anime</h2>
            </div>
        </div>

        <!-- Grid Container jahan cards JS se load honge -->
        <div class="anime-grid" id="animeGrid">
            <!-- Cards yahan automatic aayenge -->
        </div>
    </main>

    <!-- Bottom Navigation (Anime Tab Active) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="anime.html" class="nav-item active"> <!-- Active class yahan hai -->
            <i class="fa-solid fa-face-smile"></i>
            <span>Anime</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Movies</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-border-all"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
