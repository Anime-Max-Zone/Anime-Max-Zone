<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="theme-color"
        content="#08060d"
    />

    <meta
        name="description"
        content="Explore anime details, episodes, and your favorite anime on Anime Max Zone."
    />

    <title>Loading... — Anime Max Zone</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    />

    <!-- Anime Details CSS -->
    <link
        rel="stylesheet"
        href="anime.css"
    />
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">

        <a
            href="index.html"
            class="logo-link"
            aria-label="Anime Max Zone Home"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 1500 300"
                class="nav-logo-svg"
                role="img"
                aria-label="Anime Max"
            >
                <defs>
                    <linearGradient
                        id="maxGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%"
                    >
                        <stop
                            offset="0%"
                            stop-color="#e2a0ff"
                        />

                        <stop
                            offset="50%"
                            stop-color="#a855f7"
                        />

                        <stop
                            offset="100%"
                            stop-color="#7e22ce"
                        />
                    </linearGradient>
                </defs>

                <g
                    font-family="'Arial Black', 'Impact', sans-serif"
                    font-weight="900"
                    font-size="180"
                    letter-spacing="2"
                    dominant-baseline="central"
                >
                    <text
                        x="50"
                        y="150"
                        fill="#ffffff"
                    >ANIME</text>

                    <text
                        x="740"
                        y="150"
                        fill="url(#maxGradient)"
                        class="animated-max-text"
                    >MAX</text>
                </g>
            </svg>
        </a>

        <div class="nav-actions">

            <!-- Search Button -->
            <button
                type="button"
                class="btn-icon"
                id="openSearchBtn"
                aria-label="Search"
                aria-controls="searchOverlay"
                aria-expanded="false"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
                    />
                </svg>
            </button>

        </div>
    </header>


    <!-- ================= SEARCH OVERLAY ================= -->
    <div
        id="searchOverlay"
        class="search-overlay"
        aria-hidden="true"
    >
        <div class="search-panel">

            <!-- Search Logo -->
            <div class="search-logo-container">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 1500 300"
                    class="search-logo-svg"
                    role="img"
                    aria-label="Anime Max"
                >
                    <defs>
                        <linearGradient
                            id="maxGradientSearch"
                            x1="0%"
                            y1="0%"
                            x2="0%"
                            y2="100%"
                        >
                            <stop
                                offset="0%"
                                stop-color="#e2a0ff"
                            />

                            <stop
                                offset="50%"
                                stop-color="#a855f7"
                            />

                            <stop
                                offset="100%"
                                stop-color="#7e22ce"
                            />
                        </linearGradient>
                    </defs>

                    <g
                        font-family="'Arial Black', 'Impact', sans-serif"
                        font-weight="900"
                        font-size="180"
                        letter-spacing="2"
                        dominant-baseline="central"
                    >
                        <text
                            x="50"
                            y="150"
                            fill="#ffffff"
                        >ANIME</text>

                        <text
                            x="740"
                            y="150"
                            fill="url(#maxGradientSearch)"
                            class="animated-max-text"
                        >MAX</text>
                    </g>
                </svg>

            </div>


            <!-- Search Header -->
            <div class="search-header">

                <div class="search-input-group">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                        stroke="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
                        />
                    </svg>

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search anime, genres..."
                        autocomplete="off"
                        aria-label="Search anime and genres"
                    />

                </div>

                <!-- Close Search -->
                <button
                    type="button"
                    id="closeSearchBtn"
                    class="btn-close"
                    aria-label="Close search"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                        stroke="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                </button>

            </div>


            <!-- Live Search Suggestions -->
            <div
                id="liveSuggestions"
                class="live-suggestions"
                aria-live="polite"
            >
                <!-- Populated by anime.js -->
            </div>

        </div>
    </div>


    <!-- ================= MAIN CONTENT ================= -->
    <main id="animeDetailsContainer">

        <!-- Loading Skeleton -->
        <div
            id="detailsLoading"
            style="padding: 2rem; text-align: center;"
            role="status"
            aria-live="polite"
        >

            <div
                class="skeleton"
                style="width: 100%; height: 300px; margin-bottom: 1rem;"
            ></div>

            <div
                class="skeleton"
                style="width: 60%; height: 40px; margin: 0 auto 1rem;"
            ></div>

            <div
                class="skeleton"
                style="width: 80%; height: 100px; margin: 0 auto;"
            ></div>

            <span class="visually-hidden">
                Loading anime details...
            </span>

        </div>


        <!-- Anime Details -->
        <div
            id="detailsContent"
            style="display: none;"
        >
            <!-- Populated by anime.js -->
        </div>

    </main>


    <!-- ================= BOTTOM NAVIGATION ================= -->
    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <!-- Home -->
        <a
            href="index.html"
            class="nav-item"
            aria-label="Home"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"
                />
            </svg>

            <span>Home</span>
        </a>


        <!-- Search -->
        <button
            type="button"
            class="nav-item"
            id="navSearchBtn"
            aria-label="Search"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
                />
            </svg>

            <span>Search</span>
        </button>


        <!-- Watchlist -->
        <a
            href="watchlist.html"
            class="nav-item"
            aria-label="Watchlist"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"
                />
            </svg>

            <span>Watchlist</span>
        </a>


        <!-- Settings -->
        <a
            href="settings.html"
            class="nav-item"
            aria-label="Settings"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
            </svg>

            <span>Settings</span>
        </a>

    </nav>


    <!-- ================= ACCESSIBILITY HELPERS ================= -->
    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>


    <!-- Anime Details JavaScript -->
    <script type="module" src="anime.js"></script>

</body>
</html>
