<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Default title, JavaScript will update this dynamically -->
    <title>Loading... — Anime Max Zone</title>
    
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- External CSS Link for Anime Details -->
    <link rel="stylesheet" href="anime.css" />
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <a href="index.html" class="logo-link" aria-label="Anime Max Zone Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" class="nav-logo-svg">
                <defs>
                    <linearGradient id="maxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#e2a0ff" />
                        <stop offset="50%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#7e22ce" />
                    </linearGradient>
                </defs>
                <g font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="180" letter-spacing="2" dominant-baseline="central">
                    <text x="50" y="150" fill="#ffffff">ANIME</text>
                    <text x="740" y="150" fill="url(#maxGradient)" class="animated-max-text">MAX</text>
                </g>
            </svg>
        </a>

        <div class="nav-actions">
            <!-- Search Icon -->
            <button class="btn-icon" onclick="window.location.href='index.html'" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main id="animeDetailsContainer">
        <!-- Skeleton Loader (Displayed while data is fetching) -->
        <div id="detailsLoading" style="padding: 2rem; text-align: center;">
            <div class="skeleton" style="width: 100%; height: 300px; margin-bottom: 1rem;"></div>
            <div class="skeleton" style="width: 60%; height: 40px; margin: 0 auto 1rem;"></div>
            <div class="skeleton" style="width: 80%; height: 100px; margin: 0 auto;"></div>
        </div>

        <!-- Actual Details (Populated by JavaScript) -->
        <div id="detailsContent" style="display: none;"></div>
    </main>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Home</span>
        </a>
        
        <button class="nav-item" onclick="window.location.href='index.html'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
            </svg>
            <span>Search</span>
        </button>

        <a href="watchlist.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            <span>Watchlist</span>
        </a>

        <a href="settings.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Anime Detail Script -->
    <script type="module" src="anime.js"></script>
</body>
</html>
