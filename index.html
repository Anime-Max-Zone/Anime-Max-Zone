<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Max Zone - Home</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ================= FIREBASE SDK (REAL DATA) ================= -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <!-- =========================================================== -->
    
    <!-- Main CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= SPLASH LOADING SCREEN ================= -->
    <div id="splash-screen">
        <div class="splash-logo">
            <i class="fa-solid fa-play"></i>
        </div>
        <h1 class="splash-text">ANIME <span class="purple-text">MAX</span> ZONE</h1>
        <p class="splash-subtext">Watch Your Favourite Anime</p>
        <div class="splash-loader"></div>
    </div>
    <!-- ========================================================= -->

    <!-- Header Section (Sticky) -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>
            <div class="logo-text">
                <h1>ANIME <span class="purple-text">MAX</span> ZONE</h1>
                <p>Watch Your Favourite Anime</p>
            </div>
        </div>
        <div class="search-area" id="openSearchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- ================= SEARCH OVERLAY PANEL ================= -->
    <div class="search-overlay" id="searchPanel">
        <div class="search-header">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search anime, movies, cartoons..." autocomplete="off">
            </div>
            <button class="cancel-btn" id="closeSearchBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="search-results" id="searchResults">
            <p class="search-hint">Start typing to search...</p>
        </div>
    </div>
    <!-- ========================================================= -->

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Section 1: Latest Anime -->
        <section class="content-section">
            <div class="section-title">
                <div class="title-left">
                    <span class="vertical-bar"></span>
                    <h2>Latest Anime</h2>
                </div>
                <a href="anime.html" class="view-more">View More »</a>
            </div>
            
            <!-- Shimmer Skeleton Container -->
            <div class="cards-container" id="latestContainer">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>

        <!-- Section 2: Latest Anime Movies -->
        <section class="content-section">
            <div class="section-title">
                <div class="title-left">
                    <span class="vertical-bar"></span>
                    <h2>Latest Anime Movies</h2>
                </div>
                <a href="movies.html" class="view-more">View More »</a>
            </div>
            
            <!-- Shimmer Skeleton Container -->
            <div class="cards-container" id="newArrivalsContainer">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>
    </main>

    <!-- Animated Bottom Navigation -->
    <nav class="bottom-nav">
        <!-- Home Tab (Active) -->
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <!-- Anime Tab -->
        <a href="anime.html" class="nav-item">
            <i class="fa-solid fa-face-smile"></i>
            <span>Anime</span>
        </a>
        <!-- Movies Tab -->
        <a href="movies.html" class="nav-item">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Movies</span>
        </a>
        <!-- Settings Tab -->
        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Main JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
