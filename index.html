<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Max Zone - Home</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>
            <div class="logo-text">
                <h1>ANIME <span class="purple-text">MAX</span> ZONE</h1>
                <p>Watch Your Favourite Anime</p>
            </div>
        </div>
        <!-- Search Icon (Clickable) -->
        <div class="search-area" id="openSearchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- ================= SEARCH OVERLAY PANEL ================= -->
    <div class="search-overlay" id="searchPanel">
        <div class="search-header">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search anime, movies, cartoons..." autocomplete="off">
            </div>
            <!-- Cancel Icon (X) -->
            <button class="cancel-btn" id="closeSearchBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <!-- Live Suggestions Yahan Aayenge -->
        <div class="search-results" id="searchResults">
            <p class="search-hint">Start typing to search...</p>
        </div>
    </div>
    <!-- ========================================================= -->

    <!-- Main Content -->
    <main class="main-content">
        <!-- Section 1: Latest Anime -->
        <section class="content-section">
            <div class="section-title">
                <div class="title-left">
                    <span class="vertical-bar"></span>
                    <h2>Latest Anime</h2>
                </div>
                <a href="#" class="view-more">View More »</a>
            </div>
            
            <div class="cards-container">
                <a href="watch.html?id=GDRIVE_ID_SOLOLEVELING" class="anime-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVistBjvjjsTvMYAczgOZ7jv8d4hxGEO8nS8iPpCkSVQ&s=10" alt="Solo Leveling">
                </a>
                <a href="watch.html?id=GDRIVE_ID_DEMONSLAYER" class="anime-card">
                    <img src="https://image.tmdb.org/t/p/w500/xUfRZu2mi8jH6SzQEJGP6tjBuYj.jpg" alt="Demon Slayer">
                </a>
                <a href="watch.html?id=GDRIVE_ID_AOT" class="anime-card">
                    <img src="https://image.tmdb.org/t/p/w500/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg" alt="Attack on Titan">
                </a>
            </div>
        </section>
        
        <!-- Section 2: On-Air Series -->
        <section class="content-section">
            <div class="section-title">
                <div class="title-left">
                    <span class="vertical-bar"></span>
                    <h2>On-Air Series</h2>
                </div>
                <a href="#" class="view-more">View More »</a>
            </div>
            
            <div class="cards-container">
                <a href="watch.html?id=GDRIVE_ID_ONEPIECE" class="anime-card">
                    <img src="https://image.tmdb.org/t/p/w500/cMD9Ygz11zjJzAovURpO75Qg7rT.jpg" alt="One Piece">
                </a>
                <a href="watch.html?id=GDRIVE_ID_SPYFAMILY" class="anime-card">
                    <img src="https://image.tmdb.org/t/p/w500/7m8pP0R4y5I5z3x2c1v0b9n8m7.jpg" alt="Spy x Family">
                </a>
                <a href="watch.html?id=GDRIVE_ID_JUJUTSU" class="anime-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTh3hSw1X2eKkBBNgd3rEtwENN-wnk38NLfJMpUoPiNlw&s=10" alt="Jujutsu Kaisen">
                </a>
            </div>
        </section>

        <!-- Section 3: New Anime Arrivals -->
        <section class="content-section">
            <div class="section-title">
                <div class="title-left">
                    <span class="vertical-bar"></span>
                    <h2>New Anime Arrivals</h2>
                </div>
                <a href="#" class="view-more">View More »</a>
            </div>
            
            <div class="cards-container">
                <a href="watch.html?id=GDRIVE_ID_NARUTO" class="anime-card">

                <a href="watch.html?id=GDRIVE_ID_AOT" class="anime-card">
                    <img src="https://image.tmdb.org/t/p/w500/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg" alt="Attack on Titan">
                </a>
                <a href="watch.html?id=GDRIVE_ID_DEMONSLAYER" class="anime-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0fMxjRck-hY6tdV_nW-SnIWjFEvO3SGjYc77oCHjPUg&s=10" alt="Demon Slayer">
